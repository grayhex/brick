# Brick V1 — application configuration (nRF52840 DK bring-up, NCS v3.4.1).
# Release hardening rules (docs/FIRMWARE_UPDATE_NRF52840.md): only img + os MCUmgr
# groups; no shell, fs, stat, taskstat, settings management over USB or BLE.

# --- image is built for MCUboot (header, signature slot, trailer) -------------------
CONFIG_BOOTLOADER_MCUBOOT=y

# --- flash: internal + external QSPI NOR (slot1 lives there) ------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_NORDIC_QSPI_NOR_STACK_WRITE_BUFFER_SIZE=16

# --- watchdog: a hung unconfirmed image must reset, so MCUboot can revert ------------
CONFIG_WATCHDOG=y

# --- logs and console on the J-Link virtual COM port (uart0) ------------------------
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MAX_LEVEL=3

# --- USB device (new stack) with one CDC ACM port carrying MCUmgr/SMP ----------------
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Brick (DEV)"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Brick V1 (DEV)"
# DEV identity (Zephyr project VID/PID). Production needs own VID/PID: open item.

# --- MCUmgr / SMP over the CDC ACM UART ---------------------------------------------
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_BASE64=y
CONFIG_MCUMGR=y
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
# CLI needs the buffer geometry and bootloader type to choose upload chunk size.
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
# Not needed in the product: leave off.
CONFIG_MCUMGR_GRP_OS_ECHO=n
CONFIG_MCUMGR_GRP_OS_TASKSTAT=n
CONFIG_MCUMGR_GRP_STAT=n
CONFIG_MCUMGR_GRP_FS=n
CONFIG_MCUMGR_GRP_SHELL=n
CONFIG_SHELL=n

# Some SMP handlers need a big stack (Nordic smp_svr sample values).
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304
CONFIG_MAIN_STACK_SIZE=2176
