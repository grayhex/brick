# Brick V1 — sysbuild options (nRF Connect SDK v3.4.1).
# Only options that are checked by a real build are listed here; see
# docs/NRF52840_BRINGUP.md for the state of hardware verification.

SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Swap with revert, no scratch partition (needs equal sector size on both slots).
# New image is started in "test" state and reverts unless the application
# confirms it after its self-test (src/main.c).
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y

# ECDSA P-256 (NCS default for nRF52840, stated explicitly on purpose).
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y

# The signing key is NOT set here: scripts/build.sh passes the absolute path of the
# DEV key generated by scripts/gen_dev_key.sh (never committed).
# sysbuild.cmake refuses to build with Nordic's public sample key.
