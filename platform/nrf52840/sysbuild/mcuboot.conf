# MCUboot image for the Brick V1 / nRF52840 DK (fragment on top of NCS MCUboot prj.conf).

# --- external QSPI NOR holds slot1 -------------------------------------------------
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_NORDIC_QSPI_NOR_STACK_WRITE_BUFFER_SIZE=16
# MCUboot cannot derive the erase size of slot1 on the external QSPI NOR at configure time
# (CMake warning with AUTO), so the sector count is stated explicitly:
# 768 KiB slot / 4 KiB erase sector = 192. scripts/verify_build.sh checks this against zephyr.dts.
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=192

# --- serial recovery over USB CDC ACM, independent of the application ----------------
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_UART_CONSOLE=n
# Enter recovery with the boot button (mcuboot-button0 = DK SW1) held at power-up / reset.
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=y
# Enter recovery automatically when there is no valid, signed application in slot0.
CONFIG_BOOT_SERIAL_NO_APPLICATION=y
# Slot state in the recovery protocol: "image list/test/confirm" works without an app.
CONFIG_BOOT_SERIAL_IMG_GRP_IMAGE_STATE=y

# DEV USB identity: Zephyr project VID, distinct product string. Not for release.
CONFIG_USB_DEVICE_MANUFACTURER="Brick (DEV)"
CONFIG_USB_DEVICE_PRODUCT="Brick V1 recovery (DEV)"

# Serial recovery needs a big stack (SMP + crypto), see Nordic smp_svr sample.
CONFIG_MAIN_STACK_SIZE=16384
