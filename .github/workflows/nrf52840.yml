name: nrf52840-platform

# nRF Connect SDK v3.4.1 is about 3 GB, so this runs only when the platform changes (or by hand).
# It proves that the sysbuild project BUILDS and that the build checks pass. It does not flash or run
# anything: hardware results are tracked in platform/nrf52840/tests/HIL_TESTPLAN.md.
on:
  pull_request:
    paths:
      - "platform/nrf52840/**"
      - "tools/dfu/**"
      - ".github/workflows/nrf52840.yml"
  push:
    branches: [main]
    paths:
      - "platform/nrf52840/**"
      - ".github/workflows/nrf52840.yml"
  workflow_dispatch:

concurrency:
  group: nrf52840-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: NCS v3.4.1 sysbuild, MCUboot + application, build checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NCS_DIR: /home/runner/ncs-ws/ncs
      BRICK_TOOLCHAIN: gnuarmemb
      GNUARMEMB_TOOLCHAIN_PATH: /usr
    steps:
      - uses: actions/checkout@v4
      - name: Build tools (GNU Arm Embedded from the distribution, see docs/NRF52840_BRINGUP.md R-19)
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          gcc-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build device-tree-compiler gperf
          python3-venv git
      - name: Workspace cache (nRF Connect SDK v3.4.1 at the pinned commits)
        uses: actions/cache@v4
        with:
          path: /home/runner/ncs-ws
          key: ncs-v3.4.1-${{ hashFiles('platform/nrf52840/ncs-v3.4.1.sources.txt', 'platform/nrf52840/scripts/setup_ncs.sh') }}
      - name: Create the workspace
        run: PYTHON=python3 platform/nrf52840/scripts/setup_ncs.sh /home/runner/ncs-ws
      - name: Every project is at the commit recorded in the repository
        run: |
          . /home/runner/ncs-ws/ncs-venv/bin/activate
          cd "$NCS_DIR"
          west list -f '{name} {path} {revision} {sha} {url}' | sort > "$RUNNER_TEMP/sources.txt"
          grep -v '^#' "$GITHUB_WORKSPACE/platform/nrf52840/ncs-v3.4.1.sources.txt" | sort > "$RUNNER_TEMP/expected.txt"
          # the manifest project itself is listed with N/A by west; compare the rest
          diff <(grep -v '^manifest ' "$RUNNER_TEMP/expected.txt") <(grep -v '^manifest ' "$RUNNER_TEMP/sources.txt")
          test "$(git -C "$NCS_DIR/nrf" rev-parse HEAD)" = "$(awk '$1=="manifest"{print $4}' "$RUNNER_TEMP/expected.txt")"
      - name: Build all four variants and check them (throw-away CI dev key)
        run: |
          export BRICK_DEV_KEY_DIR="$RUNNER_TEMP/dev-keys"
          mkdir -p "$RUNNER_TEMP/out"
          for v in release noconfirm crash hang; do
            platform/nrf52840/scripts/build.sh --variant "$v" --sign-version 0.2.0+0 --build-dir "$RUNNER_TEMP/b-$v"
            . /home/runner/ncs-ws/ncs-venv/bin/activate
            python platform/nrf52840/scripts/verify_build.py "$RUNNER_TEMP/b-$v" --ncs "$NCS_DIR" \
              --key "$BRICK_DEV_KEY_DIR/brick-dev-ecdsa-p256.pem" --md "$RUNNER_TEMP/out/check-$v.md"
          done
      - name: Building without the key script must be refused (the public Nordic key is never used)
        run: |
          . /home/runner/ncs-ws/ncs-venv/bin/activate
          export ZEPHYR_TOOLCHAIN_VARIANT=gnuarmemb GNUARMEMB_TOOLCHAIN_PATH=/usr ZEPHYR_BASE="$NCS_DIR/zephyr"
          cd "$NCS_DIR"
          if out="$(west build --sysbuild -p always -b nrf52840dk/nrf52840 "$GITHUB_WORKSPACE/platform/nrf52840" -d "$RUNNER_TEMP/b-nokey" 2>&1)"; then
            echo "build without a signing key was accepted" >&2; exit 1
          fi
          echo "$out" | grep -q "Refusing to sign with the public MCUboot sample key" || { echo "$out" | tail -30; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: nrf52840-build-checks
          path: ${{ runner.temp }}/out/check-*.md
          retention-days: 14
