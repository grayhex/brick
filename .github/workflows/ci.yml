name: ci

on:
  # Run once for a PR update rather than twice (push+PR) for each feature-branch commit.
  push:
    branches: [main]
  pull_request:

# Superseded jobs from quick successive commits need not consume additional CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Commit of grayhex/ApolloBrickGames the conformance fixtures were recorded from (docs/CONFORMANCE.md).
  APOLLO_REF: abd7c3426f28222b54db2fe280597d7578e7191c

jobs:
  host:
    name: host (${{ matrix.cc }}, ${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build cmake
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cc == 'gcc' && 'g++' || 'clang++' }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitize:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build cmake
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBRICK_SANITIZE=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  cortex-m4:
    name: Cortex-M4F cross build (portability smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build cmake gcc-arm-none-eabi libnewlib-arm-none-eabi
      - run: >
          cmake -S . -B build-m4 -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake
          -DCMAKE_BUILD_TYPE=Release -DBRICK_BUILD_TESTS=OFF
      - run: cmake --build build-m4
      - name: Size of the core
        run: cmake --build build-m4 --target brickcore_size
      - name: The core must not need a heap or stdio
        run: |
          undefined=$(arm-none-eabi-nm -u build-m4/firmware/libbrickcore.a | awk '$1=="U"{print $2}' | grep -v '^bk' | sort -u)
          echo "$undefined"
          if echo "$undefined" | grep -Eq '^(malloc|calloc|realloc|free|printf|snprintf|sprintf|puts|fopen)$'; then
            echo "forbidden libc dependency" >&2; exit 1
          fi

  fixtures:
    name: conformance fixtures are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: grayhex/ApolloBrickGames
          ref: ${{ env.APOLLO_REF }}
          path: ApolloBrickGames
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The fixtures name the same reference commit
        run: |
          grep -q "\"commit\":\"$APOLLO_REF\"" tests/fixtures/tetris/tetris.conformance.json
          grep -q "\"commit\":\"$APOLLO_REF\"" tests/fixtures/snake/snake.conformance.json
          grep -q "\"commit\":\"$APOLLO_REF\"" tests/fixtures/racing/racing.conformance.json
          grep -q "\"commit\":\"$APOLLO_REF\"" tests/fixtures/tank/tank.conformance.json
      - name: Regenerate and compare
        working-directory: tools/conformance
        run: |
          npm ci --no-audit --no-fund
          for game in tetris snake racing tank; do
            APOLLO_BRICK_GAMES="$GITHUB_WORKSPACE/ApolloBrickGames" npm run "export:$game" -- --out "/tmp/$game.conformance.json"
            cmp "/tmp/$game.conformance.json" "../../tests/fixtures/$game/$game.conformance.json"
          done
      - name: The mutation patterns still match the sources (the run itself takes minutes and is not part of CI)
        run: CHECK_ONLY=1 python3 tools/mutation/mutate_tank.py

  cad-review:
    name: STL mockup measurements are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install numpy Pillow
      - name: Measure the archived mockup and compare with the saved baseline
        run: >
          python3 tools/cad_review/stl_review.py mechanical/inbox/buildcad-r0.1/ecf3a131-untitled-part-stl.zip
          --verify mechanical/inbox/buildcad-r0.1/measurements.json --png-dir "$RUNNER_TEMP/cad-png"

  wasm:
    name: simulator as WebAssembly (same results as native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld ninja-build cmake
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        env:
          CC: clang
          CXX: clang++
      - run: cmake --build build
      - name: The WebAssembly test must be part of the run (not skipped)
        run: ctest --test-dir build -N | grep -q test_wasm
      - run: ctest --test-dir build --output-on-failure -R 'test_wasm|test_sim|test_minlibc'
      - name: Single-file simulator page
        run: sh platform/sim/web/build_wasm.sh --html build-wasm
      - uses: actions/upload-artifact@v4
        with:
          name: brick-simulator
          path: build-wasm/brick-sim.html
          retention-days: 14

  repo-hygiene:
    name: no signing keys in the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No private key material in tracked files (signing keys live outside the repo)
        run: |
          if git grep -nE -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' -- . ':!.github/workflows/ci.yml'; then
            echo "private key material found in the repository" >&2; exit 1
          fi
          if [ -n "$(git ls-files '*.pem' '*.key')" ]; then
            git ls-files '*.pem' '*.key'; echo "key files must not be tracked" >&2; exit 1
          fi

  dfu-tool:
    name: USB update tool (logic tests on a simulated device)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/dfu/requirements.txt
      - run: python -m unittest discover -s tools/dfu -v

  mechanical-params:
    name: mechanical parameters are consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checks without a CAD kernel (standard library only)
        run: python3 mechanical/src/check_params.py
      - name: The checks must be able to fail
        run: python3 mechanical/src/test_check_params.py

  mechanical-cad:
    name: parametric case builds and its validation can fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r mechanical/requirements.txt
      - name: Build the 20 mm and 22 mm assemblies and validate them
        run: |
          python3 mechanical/src/build.py --thickness 20 --out "$RUNNER_TEMP/cad/t20" --report "$RUNNER_TEMP/cad/validation-t20.md"
          python3 mechanical/src/build.py --thickness 22 --out "$RUNNER_TEMP/cad/t22" --report "$RUNNER_TEMP/cad/validation-t22.md"
      - name: Deliberately broken models must be caught
        run: python3 mechanical/src/test_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: brick-r02-mockup-cad
          path: ${{ runner.temp }}/cad
          retention-days: 14
